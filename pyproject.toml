[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "aissa"
version = "0.2.0"
description = "Local experimental multilingual email classification"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
aissa = "aissa.cli:main"

[tool.setuptools]
packages = ["aissa"]
