# Copy to /etc/rspamd/local.d/aissa.conf; loaded by our Lua module.
enabled = true;
token_file = "/etc/rspamd/local.d/aissa.token";
#sample_percent = 0.2; # 100=all eligible messages; 0.2=one in 500 on average
sample_percent = 100;
combine = "all"; # all=AND, any=OR. Sampling is always applied afterwards.
unknown_country = "skip"; # only relevant when a country condition is enabled
max_message_bytes = 2097152;

# Empty/unset conditions => all messages eligible.
# country_not_in = ["DE"];
# require_url = true;
# min_rspamd_score = 3.0;
# symbols_any = ["R_DKIM_REJECT", "PHISHING"];
# account_min_10m = 20;
# ip_min_10m = 100;
# account_ai_suspect_min = 2;
# ip_ai_suspect_min = 5;
# account_confirmed_min = 1;
# ip_confirmed_min = 3;

# Redis credentials and servers come from rspamd's effective Redis configuration.
# AISSA uses that configuration's DB; no separate DB 6 configuration is needed.
node_id = "manta";
redis_timeout = 0.2;
result_poll_seconds = 2;
scoring_enabled = true;
score_wait_seconds = 10;
.include "$LOCAL_CONFDIR/local.d/aissa-scores.conf"
